[package]
name = "pkpdutils-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Non-compartmental analysis of pharmacokinetic timecourses"
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
# the version is what a published `pkpdutils-core` resolves against; the path is
# what the workspace builds
pkpdutils-abi = { path = "../abi", version = "0.4.1" }
pkpdutils-units = { path = "../units", version = "0.4.1" }
thiserror.workspace = true
rayon = { workspace = true, optional = true }

[features]
# The row shards of the analysis, which need threads: a native host asks for them, a wasm
# instance has none and runs one kernel instance per Web Worker instead (rayon compiles for both
# wasm targets and reports one thread there, so the feature buys an instance nothing and only
# adds a dependency). Off by default, so that the wasm build is the plain one.
parallel = ["dep:rayon"]

[lints]
workspace = true
