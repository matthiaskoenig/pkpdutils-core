[package]
name = "pkpdutils-oracles"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Conformance oracles of pkpdutils, vendored with checksums"
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
# never published: it exists for the gate over `testdata/oracles/`, which lives
# at the workspace root and cannot be packaged with any one crate
publish = false

[dev-dependencies]
# the kernel under test, the wire shapes its input is built from and the unit registry
# the oracle's units are converted with; by path only, since this crate is never
# published and so never resolves them from a registry
pkpdutils-abi = { path = "../abi" }
pkpdutils-core = { path = "../core" }
pkpdutils-units = { path = "../units" }
# the validation oracle is read into typed structs with `deny_unknown_fields`, so a key it
# gains or loses fails the gate instead of being ignored
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

[lints]
workspace = true
