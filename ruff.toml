# The python of this repository is `scripts/`: the fixture generators of
# `crates/oracles` and the python column of `BENCHMARKS.md`. The selection, the
# line length and the target version are the ones of `.ruff.toml` of the python
# package (`pkpdutils`), so that a file reads the same in both repositories.
# Without a configuration ruff lints against whatever its default selection of
# the day happens to be, which is how this gate drifted.

# Same as Black.
line-length = 88
indent-width = 4

# `pkpdutils` requires python >= 3.13, so that is what these scripts run under
target-version = "py313"

[lint]
# Pyflakes (`F`) and a subset of pycodestyle (`E`), plus:
#   W    pycodestyle warnings
#   I    import sorting
#   D    docstrings (google convention, see [lint.pydocstyle])
#   UP   pyupgrade, keeps the code on current python syntax
#   B    bugbear, likely bugs and design problems
#   C4   comprehensions
#   SIM  simplifications
#   RET  return statements
#   G    logging format, lazy `%s` instead of f-strings
#   PIE  misc lints
#   RUF  ruff specific rules
# plus one rule family the python package does not select, because the scripts
# here already carry justified `# noqa: BLE001` directives and a selection which
# left the rule out would turn every one of them into dead weight:
#   BLE  blind `except`, each one has to name what it swallows
select = [
    "E4", "E7", "E9", "F", "W", "I", "D", "UP", "B", "C4", "SIM", "RET", "G", "PIE", "RUF",
    "BLE",
]
ignore = [
    # names such as `König` are not ambiguous unicode, they are german
    "RUF001",
    "RUF002",
    "RUF003",
]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[lint.per-file-ignores]
# B023: the two closures of `main`, `front_end` and `core`, read the batch and
# the arrays of the shape being timed; `report` and `timing` call them inside
# the same loop pass and keep no reference, so none of them outlives the pass
# that binds it and the late binding the rule warns about cannot happen
"scripts/python_timing.py" = ["B023"]

[lint.isort]
# `pkpdutils` is an installed dependency here and not a package of this
# repository, so it is third party and shares its block with numpy. It sits in a
# block of its own in the python package only because the `src/pkpdutils` of
# that repository makes it first party there.
known-third-party = ["pkpdutils"]

[lint.pydocstyle]
convention = "google"  # Accepts: "google", "numpy", or "pep257".
