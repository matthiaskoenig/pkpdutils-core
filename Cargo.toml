[workspace]
resolver = "2"
members = ["crates/abi", "crates/oracles", "crates/units"]
# the throwaway package of the first spike sits at the repository root and is not a member
exclude = ["spike"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
authors = ["Matthias König"]
repository = "https://github.com/matthiaskoenig/pkpdutils-core"
readme = "README.md"
keywords = ["pharmacokinetics", "nca", "pkpd", "units", "wasm"]
categories = ["science", "wasm"]

[workspace.dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
bitflags = "2"
sha2 = "0.11"
