[workspace]
resolver = "2"
members = ["crates/abi", "crates/units"]
# the throwaway package of the first spike sits at the repository root and is not a member
exclude = ["spike"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Matthias König"]

[workspace.dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
bitflags = "2"
sha2 = "0.11"
